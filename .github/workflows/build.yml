name: Build Kernel 4.14 Surya SD732G

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig yang dipakai'
        required: false
        default: 'surya_defconfig'
      lto_mode:
        description: 'Mode LTO (thin/full/none)'
        required: false
        default: 'full'
        type: choice
        options:
          - thin
          - full
          - none
      enable_o3:
        description: 'Eksperimental: paksa -O3 seluruh kernel (butuh init/Kconfig yang sudah ditambal, lihat catatan di step build kernel, jika sudah ubah ke true)'
        required: false
        default: false
        type: boolean
      artifact_scope:
        description: 'File yang diupload sebagai artifact'
        required: false
        default: 'ringkas'
        type: choice
        options:
          - ringkas
          - lengkap
  push:
    branches:
      - main   # TODO: ganti sesuai nama branch

env:
  KERNEL_DIR: ${{ github.workspace }}/kernel
  TC_DIR: ${{ github.workspace }}/toolchain/aosp-clang
  OUT_DIR: ${{ github.workspace }}/kernel/out
  AOSP_CLANG_TAG: r547379
  AOSP_CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # batas runner free 6 jam, beri margin

    steps:
      # ------------------------------------------------------------------
      # 1. CHECKOUT SOURCE
      # ------------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          path: kernel

      # ------------------------------------------------------------------
      # 2. CEK SISA DISK
      # ------------------------------------------------------------------
      - name: Cek sisa disk
        run: df -h /

      # ------------------------------------------------------------------
      # 3. SWAP TAMBAHAN (menyesuaikan mode LTO)
      # ------------------------------------------------------------------
      - name: Setup swap tambahan
        run: |
          LTO_MODE="${{ github.event.inputs.lto_mode || 'full' }}"

          if [ "$LTO_MODE" = "full" ]; then
            SWAP_SIZE="8G"
          else
            SWAP_SIZE="4G"
          fi

          echo "Menambahkan swap ${SWAP_SIZE} (mode LTO: ${LTO_MODE})..."
          sudo fallocate -l "$SWAP_SIZE" /swapfile_ci
          sudo chmod 600 /swapfile_ci
          sudo mkswap /swapfile_ci
          sudo swapon /swapfile_ci
          free -h

      # ------------------------------------------------------------------
      # 4. INSTALL DEPENDENCIES BUILD
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential zip curl git python3 \
            python-is-python3 ccache llvm lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ------------------------------------------------------------------
      # 5. CACHE TOOLCHAIN AOSP CLANG
      # ------------------------------------------------------------------
      - name: Cache AOSP Clang toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: ${{ env.TC_DIR }}
          key: aosp-clang-${{ env.AOSP_CLANG_TAG }}

      - name: Download AOSP Clang toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TC_DIR"
          curl -L --fail \
            "${AOSP_CLANG_URL}/+archive/refs/heads/main/clang-${AOSP_CLANG_TAG}.tar.gz" \
            -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$TC_DIR"
          rm -f /tmp/clang.tar.gz

      # ------------------------------------------------------------------
      # 6. CACHE CCACHE
      #    Catatan: build414-optimasi-v2.sh kamu sengaja "No ccache" untuk
      #    build lokal, tapi di CI ccache tetap dipakai
      #    karena tiap run mulai dari VM kosong - tanpa
      #    cache lintas-run, tiap build akan selalu kompilasi dari nol.
      # ------------------------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-surya414-${{ github.event.inputs.defconfig || 'surya_defconfig' }}-${{ github.run_id }}
          restore-keys: |
            ccache-surya414-${{ github.event.inputs.defconfig || 'surya_defconfig' }}-

      - name: Setup ccache
        run: |
          export CCACHE_DIR=~/.ccache
          ccache -M 5G
          ccache -z

      # ------------------------------------------------------------------
      # 7. SETUP TOOLCHAIN ENV
      # ------------------------------------------------------------------
      - name: Setup toolchain PATH
        run: echo "$TC_DIR/bin" >> "$GITHUB_PATH"

      - name: Show toolchain info
        run: |
          which clang
          clang --version

      # ------------------------------------------------------------------
      # 7.5. SIAPKAN NAMA ARTIFACT
      # ------------------------------------------------------------------
      - name: Siapkan nama artifact
        id: meta
        if: always()
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_SAFE="${BRANCH_NAME//\//-}"
          TANGGAL=$(date +'%d%m%Y')
          echo "artifact_name=kernel-4.14-surya-${BRANCH_SAFE}-${{ github.run_number }}-${TANGGAL}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 8. BUILD KERNEL (dengan timer + optimasi
      #    : CFLAGS Kryo 470, LTO via scripts/config,
      #    toggle -O3 eksperimental, KBUILD_BUILD_USER/HOST/TIMESTAMP)
      # ------------------------------------------------------------------
      - name: Build kernel
        id: build
        run: |
          START_TIME=$(date +%s)

          cd "$KERNEL_DIR"
          mkdir -p "$OUT_DIR"

          DEFCONFIG="${{ github.event.inputs.defconfig || 'surya_defconfig' }}"
          LTO_MODE="${{ github.event.inputs.lto_mode || 'full' }}"
          ENABLE_O3="${{ github.event.inputs.enable_o3 || 'false' }}"

          # Optimasi khusus Kryo 470 (2x Cortex-A76 + 6x Cortex-A55, ARMv8.2-A).
          # -mcpu sengaja tidak dipakai: Clang tidak dukung sintaks big.LITTLE
          # gabungan ala GCC ("-mcpu=cortex-a76.cortex-a55" -> build error),
          # dan -mcpu=cortex-a76 saja kurang ideal karena core kecilnya juga
          # ikut jalan. -march tanpa -mcpu paling aman untuk SoC heterogen ini.
          CUSTOM_CFLAGS="-march=armv8.2-a -mno-outline -mno-outline-atomics"

          TOOLCHAIN_ARGS=(
            ARCH=arm64
            CC="ccache clang"
            HOSTCC="ccache clang"
            HOSTCXX="ccache clang++"
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            READELF=llvm-readelf
            OBJSIZE=llvm-size
            LLVM=1
            LLVM_IAS=1
            KBUILD_BUILD_USER=builder
            KBUILD_BUILD_HOST=ardiantowb
            KBUILD_BUILD_TIMESTAMP="$(TZ='UTC' date '+%a %B %d %H:%M:%S %Z %Y')"
            # KBUILD_BUILD_TIMESTAMP="$(TZ='Asia/Jakarta' date '+%a %B %d %H:%M:%S %Z %Y')"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KCFLAGS="$CUSTOM_CFLAGS"
          )

          echo "=== Defconfig: $DEFCONFIG | LTO: $LTO_MODE | O3 eksperimental: $ENABLE_O3 ==="

          LOG_FILE="${{ github.workspace }}/build.log"

          # --- Generate defconfig awal ---
          make O="$OUT_DIR" "${TOOLCHAIN_ARGS[@]}" "$DEFCONFIG" 2>&1 | tee "$LOG_FILE"

          # --- Manipulasi LTO lewat scripts/config ---
          # (make - source 4.14 ini butuh injeksi manual ke .config.)
          if [ "$LTO_MODE" = "full" ]; then
            echo "--> Menyuntikkan konfigurasi: FULL LTO..." | tee -a "$LOG_FILE"
            ./scripts/config --file "$OUT_DIR/.config" -e LTO_CLANG
            ./scripts/config --file "$OUT_DIR/.config" -d THINLTO
          elif [ "$LTO_MODE" = "thin" ]; then
            echo "--> Menyuntikkan konfigurasi: THIN LTO..." | tee -a "$LOG_FILE"
            ./scripts/config --file "$OUT_DIR/.config" -e LTO_CLANG
            ./scripts/config --file "$OUT_DIR/.config" -e THINLTO
          else
            echo "--> Menyuntikkan konfigurasi: TANPA LTO (NONE)..." | tee -a "$LOG_FILE"
            ./scripts/config --file "$OUT_DIR/.config" -d LTO_CLANG
            ./scripts/config --file "$OUT_DIR/.config" -d THINLTO
          fi

          # --- Toggle eksperimental -O3, dengan guard Kconfig sama seperti build local ---
          if [ "$ENABLE_O3" = "true" ]; then
            if grep -q "CC_OPTIMIZE_FOR_PERFORMANCE_O3" "$KERNEL_DIR/init/Kconfig" 2>/dev/null; then
              echo "--> Menyuntikkan konfigurasi: CC_OPTIMIZE_FOR_PERFORMANCE_O3 (eksperimental)..." | tee -a "$LOG_FILE"
              ./scripts/config --file "$OUT_DIR/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
            else
              echo "--> CC_OPTIMIZE_FOR_PERFORMANCE_O3 tidak tersedia di init/Kconfig source ini, dilewati." | tee -a "$LOG_FILE"
            fi
          fi

          # --- Validasi ulang .config setelah manipulasi manual ---
          make O="$OUT_DIR" "${TOOLCHAIN_ARGS[@]}" olddefconfig 2>&1 | tee -a "$LOG_FILE"

          echo "--- Cek status LTO_CLANG/THINLTO di .config ---" | tee -a "$LOG_FILE"
          grep -E "CONFIG_LTO_CLANG|CONFIG_THINLTO" "$OUT_DIR/.config" | tee -a "$LOG_FILE" || true

          # --- Build utama ---
          make -j"$(nproc --all)" O="$OUT_DIR" "${TOOLCHAIN_ARGS[@]}" 2>&1 | tee -a "$LOG_FILE"
          BUILD_EXIT=${PIPESTATUS[0]}

          ccache -s | tee -a "$LOG_FILE"

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))

          echo "-----------------------------------------------------"
          echo "Waktu total kompilasi: ${MIN} menit ${SEC} detik"
          echo "-----------------------------------------------------"

          echo "duration_min=${MIN}" >> "$GITHUB_OUTPUT"
          echo "duration_sec=${SEC}" >> "$GITHUB_OUTPUT"
          echo "defconfig=${DEFCONFIG}" >> "$GITHUB_OUTPUT"
          echo "lto_mode=${LTO_MODE}" >> "$GITHUB_OUTPUT"
          echo "enable_o3=${ENABLE_O3}" >> "$GITHUB_OUTPUT"

          exit "$BUILD_EXIT"

      # ------------------------------------------------------------------
      # 9. CEK HASIL BUILD
      # ------------------------------------------------------------------
      - name: Verify build output
        run: |
          IMG_GZ="$OUT_DIR/arch/arm64/boot/Image.gz"
          DTB_IMG="$OUT_DIR/arch/arm64/boot/dtb.img"

          if [ -f "$IMG_GZ" ]; then
            echo "BUILD BERHASIL - Image.gz ditemukan ($(du -h "$IMG_GZ" | cut -f1))"
            if [ -f "$DTB_IMG" ]; then
              echo "DTB image juga ditemukan ($(du -h "$DTB_IMG" | cut -f1))"
            else
              echo "PERINGATAN: dtb.img tidak ditemukan"
            fi
          else
            echo "BUILD GAGAL - file Image.gz tidak ditemukan"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 10. UPLOAD ARTIFACT
      # ------------------------------------------------------------------
      - name: Upload kernel image (ringkas - folder boot)
        if: ${{ (github.event.inputs.artifact_scope || 'ringkas') == 'ringkas' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ env.OUT_DIR }}/arch/arm64/boot
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel build (lengkap, seluruh folder out / seperti build local)
        if: ${{ github.event.inputs.artifact_scope == 'lengkap' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-out
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------------
      # 10.5. UPLOAD LOG BUILD
      # ------------------------------------------------------------------
      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-log
          path: ${{ github.workspace }}/build.log
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------------
      # 11. STEP SUMMARY
      # ------------------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          {
            echo "## Ringkasan Build Kernel"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Device | Surya (SD732G / Kryo 470) |"
            echo "| Defconfig | \`${{ steps.build.outputs.defconfig }}\` |"
            echo "| Mode LTO | \`${{ steps.build.outputs.lto_mode }}\` |"
            echo "| O3 eksperimental | \`${{ steps.build.outputs.enable_o3 }}\` |"
            echo "| Waktu kompilasi | **${{ steps.build.outputs.duration_min }} menit ${{ steps.build.outputs.duration_sec }} detik** |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
